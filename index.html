 text-anchor="start">The chance of all three is 0.5 x 0.5 x 0.5 = 12.5% (1 in 8).</text><text x="48" y="571" font-size="9.7" fill="#e4caca" font-weight="400" text-anchor="start">This is an illustrative calculation, NOT a measured marriage rate.</text><text x="48" y="605" font-size="12" fill="#ff9b9e" font-weight="700" text-anchor="start">THE RAILWAY ANALOGY</text><text x="48" y="629" font-size="9.2" fill="#e4caca" font-weight="400" text-anchor="start">Imagine a 1,000-tonne train: ten 100-tonne cars, climbing a</text><text x="48" y="645" font-size="9.2" fill="#e4caca" font-weight="400" text-anchor="start">6% grade for 1 km. It rises about 60 m, requiring roughly</text><text x="48" y="661" font-size="9.2" fill="#e4caca" font-weight="400" text-anchor="start">588 megajoules of gravitational work (ignoring friction).</text><text x="48" y="677" font-size="9.2" fill="#e4caca" font-weight="400" text-anchor="start">The climb lasts 1 km, not forever. Relationship effort has no</text><text x="48" y="693" font-size="9.2" fill="#e4caca" font-weight="400" text-anchor="start">universal duration; two willing people must share the journey.</text><text x="48" y="726" font-size="10" fill="#ff6b75" font-weight="700" text-anchor="start">THE RIGHT CONNECTION IS MUTUAL, NEVER FORCED.</text><text x="615" y="498" font-size="12" fill="#ff6b75" font-weight="700" text-anchor="start">SOUNDTRACK LINKS // TYPE OR SCAN ABOVE</text><text x="615" y="524" font-size="9" fill="#fff0ef" font-weight="700" text-anchor="start">LEVEL 01</text><a href="https://on.soundcloud.com/DYVkn90YUT4fZEGKnm" target="_blank"><text x="690" y="524" font-size="9" fill="#f4dede" font-weight="400" text-anchor="start">on.soundcloud.com/DYVkn90YUT4fZEGKnm</text></a><text x="615" y="549" font-size="9" fill="#fff0ef" font-weight="700" text-anchor="start">LEVEL 02</text><a href="https://on.soundcloud.com/kUEDzabLtbvePkHssT" target="_blank"><text x="690" y="549" font-size="9" fill="#f4dede" font-weight="400" text-anchor="start">on
